[project]
name = "trading-tracker"
version = "0.1.0"
description = "다중 추세추종 방법론을 각각 독립 평가하는 주식 매매 진단 시스템"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance>=0.2.40",
    "pyarrow>=15.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "network: 실제 yfinance 호출. 기본 실행에서 제외되며 --run-network 로만 실행된다",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
